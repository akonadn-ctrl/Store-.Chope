<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الساعات - أكادير</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 15px;
    }

    .product {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.12);
    }

    .images {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 10px;
    }

    .images img {
      width: 100%;
      height: 360px;
      object-fit: cover;
      border-radius: 12px;
    }

    .info {
      padding: 25px;
      text-align: center;
    }

    .info h2 {
      font-size: 28px;
    }

    .price {
      font-size: 32px;
      font-weight: bold;
      color: #b8860b;
      margin: 15px;
    }

    .details {
      font-size: 18px;
      line-height: 2;
    }

    .order {
      display: inline-block;
      background: #25D366;
      color: white;
      text-decoration: none;
      padding: 15px 30px;
      border-radius: 30px;
      font-size: 19px;
      font-weight: bold;
      margin-top: 15px;
    }

    .phone {
      margin-top: 15px;
      font-size: 18px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    @media (max-width: 600px) {
      .images {
        grid-template-columns: 1fr;
      }

      .images img {
        height: auto;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>⌚ الساعات</h1>
  <p>ساعات أنيقة للبيع في أكادير</p>
</header>

<div class="container">

  <div class="product">

    <div class="images">

      <!-- الصورة الأولى -->
      <img src="ضع_رابط_الصورة_الأولى_هنا" alt="ساعة">

      <!-- الصورة الثانية -->
      <img src="ضع_رابط_الصورة_الثانية_هنا" alt="مجموعة ساعات">

    </div>

    <div class="info">

      <h2>ساعات أنيقة</h2>

      <div class="price">
        150 درهم
      </div>

      <div class="details">
        📍 المكان: أكادير<br>
        🚚 التوصيل: 10 دراهم<br>
        💰 الثمن: 150 درهم
      </div>

      <a class="order"
         href="https://wa.me/212783084921?text=السلام%20عليكم،%20أريد%20طلب%20الساعة%20بثمن%20150%20درهم">
        📱 اطلب الآن عبر واتساب
      </a>

      <div class="phone">
        📞 0783084921
      </div>

    </div>

  </div>

</div>

<footer>
  © 2026 - الساعات | أكادير
</footer>

</body>
        </html>
